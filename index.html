<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPS observateur Champ 4</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f6e8c">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f3f7f9;--ink:#17303b;--mut:#657d89;--pri:#0f6e8c;--soft:#e2eff4;--line:#d6e3e9}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:72px}
header{background:var(--pri);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0}#ap{flex:1;opacity:.85}
main{padding:14px;max-width:900px;margin:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pri);color:#fff;cursor:pointer}
button:disabled{opacity:.4}button.s{background:var(--soft);color:var(--pri)}
button.big{padding:16px 8px;width:100%;margin-bottom:8px;font-size:16px}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;width:100%;margin-bottom:8px}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:16px 4px}nav button.on{color:var(--pri);font-weight:700;box-shadow:inset 0 3px var(--pri)}
table{width:100%;border-collapse:collapse}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center}td:first-child,th:first-child{text-align:left}
.sc{font-size:36px;font-weight:700;text-align:center}.ch{font-size:22px;text-align:center;color:var(--mut);margin:0 0 8px}
h3{text-align:center;margin:4px 0 10px}
header{background:linear-gradient(120deg,#0f6e8c,#27a08f);box-shadow:0 2px 8px #0003}
body{background:linear-gradient(#e9f4f8,#f7fafc) fixed}
.card{box-shadow:0 2px 8px #0f6e8c18;border-radius:14px}
button.big{font-weight:600;min-height:64px;box-shadow:0 3px 0 #0003}button.big:active{transform:translateY(2px);box-shadow:none}
.grid button.big{min-height:84px;font-size:17px}
button.g{background:#2e9e6b}button.r{background:#d9534f}button.o{background:#e8923a}
nav{box-shadow:0 -2px 8px #0002}nav button.on{background:var(--soft)}
.sc{color:var(--pri);background:#e2eff4;border-radius:12px;padding:6px;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#17303b;color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}#toast.on{opacity:1}
.ct{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;max-width:300px;margin:0 auto 8px}.ct button,.zc{height:34px;border-radius:6px;font-size:13px;padding:0}.ct button{background:#cfe6ee;color:var(--ink)}.ct button.on{background:var(--pri);color:#fff}.zc{display:flex;align-items:center;justify-content:center}.cw{position:relative;max-width:300px;margin:0 auto 4px}.cw svg{display:block;width:100%;border-radius:10px}.cg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(6,1fr)}.cg button,.cg .zc{height:auto;border-radius:0;background:transparent;border:1px dashed rgba(255,255,255,.4);color:#fff;padding:0;font-size:15px}.cg button.on{background:rgba(255,200,0,.6)}.lay{display:block}.pos{display:flex;align-items:center;gap:8px;margin:6px 0 12px}.pos small{flex:0 0 22%;font-weight:600;font-size:13px}.pos small:last-child{text-align:right}.rail{position:relative;flex:1;height:46px;background:var(--soft);border-radius:23px}.ball{position:absolute;top:50%;font-size:30px;line-height:1;transform:translate(-50%,-50%);transition:left .7s ease}@media (orientation:landscape){.lay{display:flex;gap:12px;align-items:flex-start}.lay>.card{flex:0 0 38%;margin-bottom:0}.lay>.grid{flex:1}.lay .cw{max-width:230px}}.ct .net{grid-column:1/-1;text-align:center;font-size:12px;color:var(--mut);border-top:3px solid var(--ink);padding-top:2px}
</style></head><body>
<header><h1>EPS observateur Champ 4</h1><span id="ap"></span><button class="s" id="chg" onclick="chg()">Changer d'APSA</button><button class="s" onclick="go('ens')">Espace enseignant</button><button class="s" onclick="upd()">⟳ Mise à jour</button></header>
<main></main><div id="toast"></div>
<nav hidden>
<button data-t="eq" onclick="go('eq')">👥 Équipes</button><button data-t="po" onclick="go('po')">🏆 Poules</button>
<button data-t="match" onclick="go('match')">⏱️ Match</button><button data-t="bil" onclick="go('bil')">📊 Bilan</button></nav>
<script>
/* o: [clé, libellé, point] — point 1 = marque pour l'équipe, -1 = point pour l'adversaire, 0 = aucun. c:1 = sport collectif */
const col=[["poss","Possession",0],["tir","Tir manqué / arrêté",0],["but","But / panier / essai / point",1],["perte","Perte de balle",0],["faute","Faute",0]];
const rac=[["gag","Point gagnant",1],["serv","Service gagnant",1],["faute","Faute directe",-1]];
const APSA0={"Handball":{c:1,o:col},"Basket-ball":{c:1,o:col},"Football":{c:1,o:col},"Rugby":{c:1,o:col},"Ultimate":{c:1,o:col},
"Badminton":{o:rac},"Tennis de table":{o:rac},"Volley-ball":{o:[["gag","Attaque gagnante",1],["serv","Service gagnant",1],["faute","Faute directe",-1]]}};
const APSA={
"Handball":{c:1,o:[["poss","Possession",0],["pas","Passe décisive",0],["tir","Tir arrêté / manqué",0],["but","But",1],["perte","Balle perdue",0],["faute","Faute",0]]},
"Basket-ball":{c:1,o:[["poss","Possession",0],["reb","Rebond",0],["tir","Tir manqué",0],["but","Panier à 2 pts",2],["tr3","Panier à 3 pts",3],["lf","Lancer franc réussi",1],["perte","Balle perdue",0],["faute","Faute",0]]},
"Football":{c:1,o:[["poss","Possession",0],["pas","Passe décisive",0],["tir","Tir non cadré / arrêté",0],["but","But",1],["perte","Balle perdue",0],["faute","Faute",0],["cor","Corner obtenu",0]]},
"Rugby":{c:1,o:[["poss","Possession",0],["gain","Franchissement / gain de terrain",0],["but","Essai",5],["trf","Transformation",2],["pla","Plaquage réussi",0],["perte","Balle perdue",0],["faute","Faute",0]]},
"Ultimate":{c:1,o:[["poss","Possession du disque",0],["pas","Passe réussie",0],["but","Point marqué",1],["perte","Disque perdu",0],["faute","Faute",0]]},
"Volley-ball":{o:[["serv","Service gagnant",1],["gag","Attaque gagnante",1],["blo","Contre gagnant",1],["sf","Service manqué",-1],["faute","Faute directe",-1]]},
"Badminton":{o:[["gag","Coup gagnant",1],["serv","Service gagnant",1],["fil","Faute : filet",-1],["dehors","Faute : dehors",-1],["faute","Faute de service",-1]]},
"Tennis de table":{o:[["gag","Coup gagnant",1],["serv","Service gagnant",1],["fil","Faute : filet",-1],["dehors","Faute : hors table",-1],["faute","Faute de service",-1]]}};
let S={ap:null,teams:[],poules:[],matches:[],cur:null,bm:null,obs:{},eleves:[],cfg:{conseil:true}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem("eps")||"{}"))}catch(e){}
if(S.ap&&!APSA[S.ap])S.ap=null;S.matches=S.matches.filter(m=>APSA[m.ap]);S.poules=S.poules.filter(p=>APSA[p.ap]);
const save=()=>{try{localStorage.setItem("eps",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tab="match";
const pc=(a,b)=>b?Math.round(1000*a/b)/10+"%":"–";
const cur=()=>S.matches.find(m=>m.id==S.cur);
const name=id=>(S.teams.find(t=>t.id==id)||{n:"?"}).n;
const O=ap=>S.obs[ap]||APSA[ap].o;
const P=(m,k)=>(O(m.ap).find(o=>o[0]==k)||[0,0,0])[2];
const cnt=(m,t,k)=>m.ev.filter(e=>e[0]==t&&e[1]==k).length;
const score=(m,t)=>m.ev.reduce((s,[x,k])=>{const p=P(m,k);return s+(p>0&&x==t?p:p<0&&x!=t?-p:0)},0);
const el=m=>m.dur+(m.t0?(Date.now()-m.t0)/1000:0);
const fmt=s=>String(Math.floor(s/60)).padStart(2,0)+":"+String(Math.floor(s%60)).padStart(2,0);
const go=t=>{tab=t;R()},chg=()=>{S.ap=null;S.cur=null;tab="match";save();R()};
const setAp=k=>{S.ap=k;S.cur=null;tab="match";save();R()};
function R(){const a=S.ap;$("#ap").textContent=a||"";$("#chg").hidden=!a;$("nav").hidden=!a;
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
$("main").innerHTML=tab=="ens"?vEns():!a?home():{eq:vEq,po:vPo,match:vMatch,bil:vBil}[tab]()}
const home0=()=>`<div class="card"><b>Choisis l'APSA à observer</b></div><div class="grid">${Object.keys(APSA).map(k=>`<button class="big" onclick="setAp('${k}')">${k}</button>`).join("")}</div>`;
/* Équipes */
const vEq0=()=>`<div class="card"><input id="tn" placeholder="Nom de l'équipe ou du joueur"><button onclick="addT()">Ajouter</button></div>`+(S.teams.map(t=>`<div class="card row"><span class="sp">${esc(t.n)}${t.c?` <small>· ${esc(t.c)}</small>`:""}</span><button class="s" onclick="delT('${t.id}')">Supprimer</button></div>`).join("")||`<p>Ajoute les équipes ou les joueurs qui vont jouer.</p>`);
const addT0=()=>{const v=$("#tn").value.trim();if(v){S.teams.push({id:uid(),n:v});save();R()}};
const delT=id=>{S.teams=S.teams.filter(t=>t.id!=id);save();R()};
/* Poules */
const vPo=()=>`<div class="card"><input id="pn" placeholder="Nom de la poule (ex. Poule A)"><p>${pick()}</p><button onclick="addP()">Créer la poule</button></div>`+S.poules.filter(p=>p.ap==S.ap).map(rank).join("");
function addP(){const ids=[...document.querySelectorAll(".pk:checked")].map(x=>x.value);if(ids.length<2)return alert("Choisis au moins 2 équipes.");
const p={id:uid(),n:$("#pn").value.trim()||"Poule",ap:S.ap,ids};S.poules.push(p);
for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)S.matches.push({id:uid(),ap:S.ap,pid:p.id,a:ids[i],b:ids[j],ev:[],dur:0,done:0});save();R()}
function rank(p){const T=Object.fromEntries(p.ids.map(i=>[i,{i,j:0,v:0,n:0,d:0,df:0}])),ms=S.matches.filter(m=>m.pid==p.id);
ms.filter(m=>m.done).forEach(m=>{const x=score(m,0),y=score(m,1),A=T[m.a],B=T[m.b];if(!A||!B)return;A.j++;B.j++;A.df+=x-y;B.df+=y-x;if(x>y){A.v++;B.d++}else if(y>x){B.v++;A.d++}else{A.n++;B.n++}});
const L=Object.values(T).sort((a,b)=>b.v-a.v||b.df-a.df);
return `<div class="card"><b>${esc(p.n)}</b> <small>(victoires, puis différence de score)</small><table><tr><th>Équipe<th>J<th>V<th>N<th>D<th>+/-</tr>${L.map((r,k)=>`<tr><td>${k+1}. ${esc(name(r.i))}<td>${r.j}<td>${r.v}<td>${r.n}<td>${r.d}<td>${r.df}</tr>`).join("")}</table>${ms.map(m=>`<div class="row" style="border-top:1px solid var(--line);padding:8px 0"><span class="sp">${esc(name(m.a))} – ${esc(name(m.b))}${m.done?` <b>${score(m,0)}-${score(m,1)}</b>`:""}</span><button onclick="play('${m.id}')">${m.done?"Revoir":"Jouer le match"}</button></div>`).join("")}<button class="s" onclick="delP('${p.id}')">Supprimer la poule</button></div>`}
const play=id=>{S.cur=id;tab="match";R()};
const delP=id=>{if(confirm("Supprimer cette poule et ses matchs ?")){S.poules=S.poules.filter(p=>p.id!=id);S.matches=S.matches.filter(m=>m.pid!=id);S.cur=null;save();R()}};
/* Match */
function vMatch(){const m=cur();
if(!m||m.ap!=S.ap){const o=S.teams.map(t=>`<option value="${t.id}">${esc(t.n)}${t.c?" ("+esc(t.c)+")":""}</option>`).join("");return `<div class="card"><b>Match libre</b><p>Équipe A</p><select id="fa">${o}</select><p>Équipe B</p><select id="fb">${o}</select><button onclick="free()">Démarrer l'observation</button></div><p>Pour un match de poule, ouvre l'onglet Poules.</p>`}
const side=t=>`<div><h3 style="color:#fff;background:${t?'#e07b39':'#0f6e8c'};border-radius:10px;padding:8px">${esc(name(t?m.b:m.a))}</h3>${O(m.ap).map(([k,l,p])=>`<button class="big ${p>0?'g':p<0?'r':k=='perte'||k=='faute'?'o':''}" ${m.done?"disabled":""} onclick="tap(${t},'${k}')">${l}<br><b>${cnt(m,t,k)}</b></button>`).join("")}</div>`;
return `<div class="card"><div class="sc">${score(m,0)} – ${score(m,1)}</div><p class="ch" id="ch">${fmt(el(m))}</p>${bar(m)}<div class="row"><button class="s" onclick="tg()">${m.t0?"Pause":"Chrono"}</button><button class="s" onclick="undo()">Annuler le dernier</button><button class="s" onclick="fin()">${m.done?"Reprendre":"Terminer"}</button><button class="s" onclick="S.cur=null;R()">Fermer</button></div></div>${m.done?check(m)+(S.cfg.conseil?coach(m):""):rap(m)}<div class="lay">${!m.done&&isR(m.ap)?ctCard(m):""}<div class="grid" style="grid-template-columns:1fr 1fr">${side(0)}${side(1)}</div></div>`}
function free(){const a=$("#fa").value,b=$("#fb").value;if(!a||a==b)return alert("Choisis deux équipes différentes.");const m={id:uid(),ap:S.ap,pid:null,a,b,ev:[],dur:0,done:0};S.matches.push(m);S.cur=m.id;save();R()}
const tap=(t,k)=>{cur().ev.push(zn==null?[t,k]:[t,k,zn]);zn=null;save();R()};
const undo=()=>{cur().ev.pop();save();R()};
const pause=m=>{if(m.t0){m.dur+=(Date.now()-m.t0)/1000;m.t0=0}};
const tg=()=>{const m=cur();m.t0?pause(m):m.t0=Date.now();save();R()};
const fin=()=>{const m=cur();pause(m);m.done=m.done?0:1;if(m.done)m.ts=Date.now();save();R()};
setInterval(()=>{const m=cur(),c=$("#ch");if(m&&m.t0&&c)c.textContent=fmt(el(m))},500);
/* Bilan */
function stats(m){const r=[],d=el(m)/60,add=(l,f)=>r.push([l,f(0),f(1)]);
if(APSA[m.ap].c){const g=(t,k)=>k=="but"?O(m.ap).filter(o=>o[2]>0).reduce((s,o)=>s+cnt(m,t,o[0]),0):cnt(m,t,k),T=t=>g(t,"tir")+g(t,"but");
add("Possessions",t=>g(t,"poss"));add("Tirs (total)",T);add("Actions de score",t=>g(t,"but"));add("Pertes de balle",t=>g(t,"perte"));add("Fautes",t=>g(t,"faute"));
add("Conversion tirs → buts",t=>pc(g(t,"but"),T(t)));add("Densité (tirs / possessions)",t=>pc(T(t),g(t,"poss")));add("Efficacité (buts / possessions)",t=>pc(g(t,"but"),g(t,"poss")));add("Pertes / possessions",t=>pc(g(t,"perte"),g(t,"poss")));
O(m.ap).filter(o=>!["poss","tir","but","perte","faute"].includes(o[0])&&!(o[2]>0)).forEach(([k,l])=>add(l,t=>g(t,k)));if(d>0){add("Tirs par minute",t=>(T(t)/d).toFixed(1));add("Buts par minute",t=>(g(t,"but")/d).toFixed(1))}}
else{const tot=score(m,0)+score(m,1);add("Points",t=>score(m,t));add("Part des points",t=>pc(score(m,t),tot));
O(m.ap).forEach(([k,l])=>add(l,t=>cnt(m,t,k)));
add("Réussite (gagnants / gagnants + fautes)",t=>{const O2=O(m.ap),c=a=>a.reduce((s,o)=>s+cnt(m,t,o[0]),0),w=c(O2.filter(o=>o[2]>0));return pc(w,w+c(O2.filter(o=>o[2]<0)))})}
return r}
function vBil(){const L=S.matches.filter(m=>m.ap==S.ap&&m.ev.length);
const m=L.find(x=>x.id==S.bm)||L[0];
return `<div class="card">${L.length?`<select onchange="S.bm=this.value;R()">${L.map(x=>`<option value="${x.id}" ${m&&x.id==m.id?"selected":""}>${esc(name(x.a))} – ${esc(name(x.b))} (${score(x,0)}-${score(x,1)})</option>`).join("")}</select><table><tr><th>Indicateur<th>${esc(name(m.a))}<th>${esc(name(m.b))}</tr>${stats(m).map(r=>`<tr><td>${r[0]}<td>${r[1]}<td>${r[2]}</tr>`).join("")}</table>${m.c&&(m.c[0]||m.c[1])?`<p><b>Conseils</b><br>${esc(name(m.a))} : ${esc(m.c[0]||"–")}<br>${esc(name(m.b))} : ${esc(m.c[1]||"–")}</p>`:""}${bilx(m)}`:"Aucun match observé pour cette APSA."}</div>
${suivi()?`<div class="card"><b>Suivi des projets de jeu</b>${suivi()}</div>`:""}<div class="card row"><button onclick="csv()">Exporter les stats (Excel)</button><button class="s" onclick="bak()">Sauvegarder</button><label class="s" style="padding:10px 14px;border-radius:10px;background:var(--soft);color:var(--pri)">Restaurer<input type="file" accept=".json" hidden onchange="imp(this)"></label></div>${rs?`<div class="card"><b>Supprimer les bilans ?</b><p>Les bilans des matchs de ${S.ap} seront effacés ; équipes, élèves et poules sont conservés. Action irréversible.</p><div class="row"><button style="background:#b3412e" onclick="rz()">Oui, supprimer les bilans</button><button class="s" onclick="rs=0;R()">Annuler</button></div></div>`:`<button class="s" onclick="rs=1;R()">Réinitialiser les bilans</button>`}`}
function dl(n,t,ty){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()}
function csv(){const rows=[["APSA","Poule","Équipe A","Équipe B","Indicateur","A","B"]];
S.matches.filter(m=>m.ev.length).forEach(m=>{const p=(S.poules.find(x=>x.id==m.pid)||{}).n||"";stats(m).forEach(r=>rows.push([m.ap,p,name(m.a),name(m.b),...r]));if(m.c)rows.push([m.ap,p,name(m.a),name(m.b),"Conseil",m.c[0]||"",m.c[1]||""]);(m.i||[]).forEach((L,t)=>{if(L.length)rows.push([m.ap,p,name(m.a),name(m.b),"Projet de jeu choisi",t?"":L.join(" | "),t?L.join(" | "):""])});[0,1].forEach(t=>Object.entries((m.v||[{},{}])[t]||{}).forEach(([x,j])=>{const s=["Non","En partie","Oui"][j];rows.push([m.ap,p,name(m.a),name(m.b),"Projet précédent : "+x,t?"":s,t?s:""])}));});
dl("stats_eps.csv","\ufeff"+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(";")).join("\n"),"text/csv")}
const bak=()=>dl("sauvegarde_eps.json",JSON.stringify(S),"application/json");
const imp=i=>{const f=i.files[0];if(f)f.text().then(t=>{try{S=Object.assign(S,JSON.parse(t));save();R()}catch(e){alert("Fichier invalide.")}})};
/* Conseil de fin de match */
const conseil=m=>`<div class="card"><b>Un conseil pour la suite ?</b>${[0,1].map(t=>`<p>Pour ${esc(name(t?m.b:m.a))}</p><textarea rows="3" oninput="sv(${t},this.value)">${esc((m.c||[])[t]||"")}</textarea>`).join("")}</div>`;
const sv=(t,v)=>{const m=cur();m.c=m.c||["",""];m.c[t]=v;save()};
/* Espace enseignant */
let unl=false,ea=null;
function vEns(){
if(!unl)return `<div class="card"><b>Espace enseignant</b><p>Entre le code d'accès.</p><input id="cd" type="password" inputmode="numeric" placeholder="Code"><button onclick="unlock()">Entrer</button> <button class="s" onclick="chg()">Retour à l'accueil</button></div>`;
const ap=ea&&APSA[ea]?ea:(S.ap||Object.keys(APSA)[0]);ea=ap;
return `<button style="margin-bottom:12px" onclick="chg()">← Retour à l'accueil</button><div class="card"><label><input type="checkbox" ${S.cfg.conseil?"checked":""} onchange="S.cfg.conseil=this.checked;save()">Projet de jeu et conseil de fin de match</label></div>
<div class="card"><b>Critères observables</b> <small>Points : positif = pour l'équipe, négatif = pour l'adversaire, 0 = sans point</small><select onchange="ea=this.value;R()">${Object.keys(APSA).map(k=>`<option ${k==ap?"selected":""}>${k}</option>`).join("")}</select>
